name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# a newer push to the same PR cancels the old run. main runs (deploys) are never cancelled mid-way
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_VERSION: 10.0.x
  NODE_VERSION: 24
  DOTNET_NOLOGO: true

jobs:
  api:
    name: API build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - run: dotnet restore

      - run: dotnet build --no-restore -c Release

      # Testcontainers starts SQL Server in Docker (preinstalled on ubuntu runners)
      - run: dotnet test --no-build -c Release --logger trx --results-directory TestResults

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults

  client:
    name: Client build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      - run: npx ng build --configuration production

      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist/client/browser

  package:
    name: Package
    needs: [api, client]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - run: dotnet publish api -c Release -o publish

      # one deployable: API + Angular build in wwwroot
      - uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: publish/wwwroot

      - run: dotnet tool restore

      # self-contained exe that applies pending migrations. building it boots Program.cs,
      # which refuses to start without config -> placeholders here, real connection string at run time
      - name: Build migrations bundle
        run: dotnet ef migrations bundle --project api --self-contained -r linux-x64 -o efbundle --force
        env:
          ConnectionStrings__GridOps: Server=placeholder;Database=placeholder
          Jwt__SigningKey: placeholder-signing-key-only-used-to-build-the-bundle

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: publish

      - uses: actions/upload-artifact@v4
        with:
          name: efbundle
          path: efbundle

  deploy:
    name: Deploy to Azure
    needs: package
    # off until Azure is set up (see deploy/README.md). flip the repo variable to enable
    if: github.ref == 'refs/heads/main' && vars.AZURE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net
    permissions:
      id-token: write # OIDC: short-lived Azure token, no stored password
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app
          path: app

      - uses: actions/download-artifact@v4
        with:
          name: efbundle

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # SQL firewall only opened to this runner for the migration, closed again after
      - name: Open SQL firewall for this runner
        run: |
          ip=$(curl -fsS https://api.ipify.org)
          az sql server firewall-rule create -g "${{ vars.AZURE_RESOURCE_GROUP }}" -s "${{ vars.AZURE_SQL_SERVER }}" \
            -n "gh-${{ github.run_id }}" --start-ip-address "$ip" --end-ip-address "$ip" -o none

      - name: Apply migrations
        run: |
          chmod +x ./efbundle
          ./efbundle --connection "${{ secrets.AZURE_SQL_CONNECTION_STRING }}"

      - name: Close SQL firewall
        if: always()
        run: |
          az sql server firewall-rule delete -g "${{ vars.AZURE_RESOURCE_GROUP }}" -s "${{ vars.AZURE_SQL_SERVER }}" \
            -n "gh-${{ github.run_id }}" -o none || true

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: app

      # free tier cold start can take a minute
      - name: Smoke test
        run: curl -fsS --retry 10 --retry-delay 15 --retry-all-errors "https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/health"
